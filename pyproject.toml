[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexlinq-linux"
version = "0.1.0"
description = "Open-source Linux control software for Phanteks NexLinq devices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "nexlinq-linux contributors" }]
dependencies = [
    "fastapi>=0.115,<0.116",
    "jinja2>=3.1,<4",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<0.35",
]

[project.optional-dependencies]
test = [
    "hatchling>=1.27,<2",
    "httpx>=0.28,<1",
]

[project.scripts]
nexlinqctl = "nexlinq.cli:main"
nexlinqd = "nexlinq.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexlinq"]
artifacts = [
    "src/nexlinq/templates/*.html",
    "src/nexlinq/static/*.css",
    "src/nexlinq/static/*.js",
]
