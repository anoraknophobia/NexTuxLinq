[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nextuxlinq"
version = "0.1.0"
description = "Open-source Linux control software for the Phanteks Matrix900 display"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NexTuxLinq contributors" }]
dependencies = [
    "fastapi>=0.115,<0.116",
    "jinja2>=3.1,<4",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<0.35",
]

[project.optional-dependencies]
test = [
    "hatchling>=1.27,<2",
    "httpx>=0.28,<1",
]

[project.scripts]
nextuxlinqctl = "nextuxlinq.cli:main"
nextuxlinqd = "nextuxlinq.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nextuxlinq"]
artifacts = [
    "src/nextuxlinq/templates/*.html",
    "src/nextuxlinq/static/*.css",
    "src/nextuxlinq/static/*.js",
]

[tool.hatch.build.targets.wheel.force-include]
"systemd/nextuxlinqd.service" = "nextuxlinq/installer_assets/nextuxlinqd.service"
"udev/70-nextuxlinq.rules" = "nextuxlinq/installer_assets/70-nextuxlinq.rules"
